<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Service | Luxora Elite Cleaning SA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- EmailJS SDK Integration -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // Paste your EmailJS Public Key here
      emailjs.init("YOUR_PUBLIC_KEY");
    })();
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
    .gold-text { color: #C5A059; }
    .gold-bg-gradient { background: linear-gradient(135deg, #DFBF77 0%, #C5A059 100%); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

  <!-- Header -->
  <header class="max-w-7xl mx-auto w-full flex items-center justify-between py-4 border-b border-slate-800">
    <a href="index.html" class="flex items-center gap-3">
      <img src="Logo.png" alt="Luxora Elite Logo" class="h-10 w-auto object-contain">
      <span class="text-lg font-bold tracking-widest uppercase text-white">
        Luxora <span class="gold-text">Elite</span>
      </span>
    </a>
    <a href="index.html" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition-colors">
      ← Back to Home
    </a>
  </header>

  <!-- Booking Container -->
  <div class="max-w-lg mx-auto w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl my-10">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold uppercase tracking-wider text-white">
        Client <span class="gold-text">Portal</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">Submit your private cleaning service request below</p>
    </div>

    <!-- Booking Form -->
    <form id="luxoraBookingForm" class="space-y-4">
      
      <!-- Full Name -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Full Name</label>
        <input 
          type="text" 
          name="user_name" 
          placeholder="Jane Doe" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Email Address -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Email Address</label>
        <input 
          type="email" 
          name="user_email" 
          placeholder="jane@example.com" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Phone Number</label>
        <input 
          type="tel" 
          name="user_phone" 
          placeholder="(210) 555-0199" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Service Requested -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Service Type</label>
        <select 
          name="service_type" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
          <option value="Executive Maintenance Cleaning">Executive Maintenance Cleaning</option>
          <option value="Deep Estate Restorative Cleaning">Deep Estate Restorative Cleaning</option>
          <option value="Move-In / Move-Out Elite">Move-In / Move-Out Elite</option>
        </select>
      </div>

      <!-- Notes / Address -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Property Address & Details</label>
        <textarea 
          name="message" 
          rows="3" 
          placeholder="Service address, preferred dates, gate codes, or special instructions..." 
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 gold-bg-gradient text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg hover:opacity-90 transition-opacity mt-4 cursor-pointer"
      >
        Submit Booking Request
      </button>

      <!-- Feedback Status Message -->
      <div id="formResult" class="text-center text-xs mt-3 hidden"></div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="text-center text-xs text-slate-600 py-4">
    © 2026 Luxora Elite Cleaning SA. All rights reserved.
  </footer>

  <!-- Script Handler -->
  <script>
    document.getElementById('luxoraBookingForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const result = document.getElementById('formResult');
      const btn = document.getElementById('submitBtn');

      result.classList.remove('hidden');
      result.className = 'text-center text-xs mt-3 text-slate-400';
      result.innerHTML = "Sending request...";
      btn.disabled = true;

      // Paste your EmailJS Service ID and Template ID here
      const serviceID = 'YOUR_SERVICE_ID';
      const templateID = 'YOUR_TEMPLATE_ID';

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          result.className = 'text-center text-xs mt-3 text-emerald-400 font-bold';
          result.innerHTML = "Booking request sent successfully! We will contact you shortly.";
          document.getElementById('luxoraBookingForm').reset();
          btn.disabled = false;
        }, (error) => {
          result.className = 'text-center text-xs mt-3 text-rose-400 font-bold';
          result.innerHTML = "Failed to send request. Check your keys or console.";
          btn.disabled = false;
        });
    });
  </script>

</body>
</html>
