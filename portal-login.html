<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Luxora Elite Cleaning</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-zinc-900 flex items-center justify-center min-h-screen">

  <div class="bg-white text-zinc-900 border border-amber-200/60 shadow-sm rounded-xl p-8 w-full max-w-md mx-4">
    <h2 id="form-title" class="text-2xl font-bold text-amber-600 tracking-wide text-center">LUXORA ELITE</h2>
    <p class="text-zinc-600 text-sm text-center mt-1">Sign in to access your account</p>

    <div id="alert-box" class="hidden mt-4 p-3 rounded-lg text-xs font-medium"></div>

    <form id="auth-form" class="mt-6 space-y-4">
      <div id="name-field" class="hidden">
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1">Full Name</label>
        <input type="text" id="name" name="name" class="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1">Email Address</label>
        <input type="email" id="email" name="email" required class="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1">Password</label>
        <input type="password" id="password" name="password" required class="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-[#D4AF37] hover:bg-[#C29F31] text-white font-medium py-2.5 px-4 rounded-lg transition-colors text-sm">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center">
      <button id="toggle-mode-btn" class="text-xs text-zinc-500 hover:text-amber-600 transition-colors">
        Don't have an account? Sign up
      </button>
    </div>

    <div id="formResult" class="hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const result = document.getElementById('formResult');
    const form = document.getElementById('auth-form');
    const formTitle = document.getElementById('form-title');
    const nameField = document.getElementById('name-field');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const alertBox = document.getElementById('alert-box');

    let isSignUp = false;

    function showAlert(message, isError) {
      alertBox.textContent = message;
      alertBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-700', 'bg-rose-50', 'text-rose-700');
      if (isError) {
        alertBox.classList.add('bg-rose-50', 'text-rose-700');
      } else {
        alertBox.classList.add('bg-emerald-50', 'text-emerald-700');
      }
    }

    toggleBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      if (isSignUp) {
        formTitle.textContent = "CREATE ACCOUNT";
        submitBtn.textContent = "Sign Up";
        nameField.classList.remove('hidden');
        toggleBtn.textContent = "Already have an account? Sign in";
      } else {
        formTitle.textContent = "LUXORA ELITE";
        submitBtn.textContent = "Sign In";
        nameField.classList.add('hidden');
        toggleBtn.textContent = "Don't have an account? Sign up";
      }
      alertBox.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;

      alertBox.classList.add('hidden');

      if (isSignUp) {
        const { data, error } = await _supabase.auth.signUp({
          email,
          password,
          options: { data: { full_name: name } }
        });
        if (error) {
          showAlert(error.message, true);
        } else {
          showAlert('Account created! Redirecting...', false);
          setTimeout(() => { window.location.replace('portal.html'); }, 1000);
        }
      } else {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
          showAlert(error.message, true);
          result.classList.remove('hidden');
          result.className = 'text-center text-xs mt-3 text-slate-400';
          result.innerHTML = "Sending request...";
          const formData = new FormData(form);
          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
          })
          .then(async (response) => {
            let json = await response.json();
            if (response.status == 200) {
              result.className = 'text-center text-xs mt-3 text-emerald-400 font-bold';
              result.innerHTML = "Booking request sent! Check your inbox soon.";
              form.reset();
            } else {
              result.className = 'text-center text-xs mt-3 text-rose-400 font-bold';
              result.innerHTML = json.message || "Something went wrong. Please try again.";
            }
          })
          .catch(error => {
            result.className = 'text-center text-xs mt-3 text-rose-400 font-bold';
            result.innerHTML = "Failed to send. Please check your internet connection.";
          });
        } else {
          window.location.replace('portal.html');
        }
      }
    });
  </script>
</body>
</html>
