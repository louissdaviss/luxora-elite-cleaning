<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Portal Login | Luxora Elite Cleaning SA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
        .gold-text { color: #C5A059; }
        .gold-bg-gradient { background: linear-gradient(135deg, #DFBF77 0%, #C5A059 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <h2 class="text-2xl font-bold uppercase tracking-wider gold-text mb-2">Client Portal</h2>
        <p class="text-xs text-slate-400 mb-6">Enter your authorized password to access estate records.</p>
        
        <form id="loginForm" class="space-y-4">
            <input type="password" id="passwordInput" placeholder="Enter password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-[#C5A059]">
            <div id="errorMsg" class="text-red-400 text-xs hidden">Incorrect password. Please try again.</div>
            <button type="submit" class="w-full py-3 rounded-xl gold-bg-gradient text-xs font-bold uppercase tracking-wider text-white shadow-md hover:opacity-90 transition-opacity">Authenticate</button>
        </form>
    </div>

    <script>
        // Clear any old active session tokens when hitting the login screen
        sessionStorage.removeItem('lxe_auth_token');

        // SHA-256 Hash for "LuxoraClient2026"
        const CORRECT_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('passwordInput').value;
            const hashedInput = await sha256(inputVal);

            if (hashedInput === CORRECT_HASH) {
                sessionStorage.setItem('lxe_auth_token', 'active');
                window.location.href = 'portal.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
