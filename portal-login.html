<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Luxora Elite Cleaning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-[#C5A059] tracking-wider font-serif">LUXORA ELITE</h1>
      <p id="form-title" class="text-slate-400 text-sm mt-1">Sign in to access your private portal</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden p-3 rounded-lg text-xs font-semibold text-center"></div>

    <!-- Auth Form -->
    <form id="auth-form" class="space-y-4">
      <div id="name-field" class="hidden">
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
        <input type="text" id="full-name" placeholder="John Doe" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#C5A059]">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="client@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#C5A059]">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#C5A059]">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#DFBF77] to-[#C5A059] text-xs font-bold uppercase tracking-wider text-white hover:opacity-90 transition-opacity">
        Log In
      </button>
    </form>

    <!-- Toggle Login / Signup -->
    <div class="text-center pt-2">
      <button id="toggle-mode-btn" class="text-xs text-slate-400 hover:text-[#C5A059] transition-colors">
        Don't have an account? Create one here
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yeabwnysjhhmjoimprbb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BjyrfHBBJ8V13lC00V5p2A_gSxohGxZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    const form = document.getElementById('auth-form');
    const formTitle = document.getElementById('form-title');
    const nameField = document.getElementById('name-field');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-mode-btn');
    const alertBox = document.getElementById('alert-box');

    toggleBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      showAlert('', false);

      if (isSignUp) {
        formTitle.textContent = 'Create a new client profile';
        nameField.classList.remove('hidden');
        submitBtn.textContent = 'Create Account';
        toggleBtn.textContent = 'Already have an account? Log in';
      } else {
        formTitle.textContent = 'Sign in to access your private portal';
        nameField.classList.add('hidden');
        submitBtn.textContent = 'Log In';
        toggleBtn.textContent = "Don't have an account? Create one here";
      }
    });

    function showAlert(message, isError = true) {
      if (!message) {
        alertBox.classList.add('hidden');
        return;
      }
      alertBox.classList.remove('hidden', 'bg-red-900/50', 'text-red-300', 'bg-emerald-900/50', 'text-emerald-300');
      if (isError) {
        alertBox.classList.add('bg-red-900/50', 'text-red-300');
      } else {
        alertBox.classList.add('bg-emerald-900/50', 'text-emerald-300');
      }
      alertBox.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('full-name').value;

      showAlert('', false);

      if (isSignUp) {
        const { data, error } = await _supabase.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName }
          }
        });

        if (error) {
          showAlert(error.message, true);
        } else {
          showAlert('Account created! Redirecting to your portal...', false);
          setTimeout(() => { window.location.href = 'portal.html'; }, 1500);
        }
      } else {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showAlert(error.message, true);
        } else {
          window.location.href = 'portal.html';
        }
      }
    });
  </script>
</body>
</html>
