<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Portal Login | Luxora Elite Cleaning SA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
        .gold-text { color: #C5A059; }
        .gold-bg-gradient { background: linear-gradient(135deg, #DFBF77 0%, #C5A059 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <h2 id="formTitle" class="text-2xl font-bold uppercase tracking-wider gold-text mb-2">Client Portal</h2>
        <p id="formSub" class="text-xs text-slate-400 mb-6">Sign in to access your estate records.</p>
        
        <form id="authForm" class="space-y-4">
            <input type="email" id="emailInput" placeholder="Email Address" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-[#C5A059]">
            <input type="password" id="passwordInput" placeholder="Password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300 focus:outline-none focus:border-[#C5A059]">
            <div id="errorMsg" class="text-red-400 text-xs hidden"></div>
            <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl gold-bg-gradient text-xs font-bold uppercase tracking-wider text-white shadow-md hover:opacity-90 transition-opacity">Sign In</button>
        </form>

        <button onclick="toggleMode()" id="toggleBtn" class="mt-4 text-xs text-slate-400 hover:text-[#C5A059] transition-colors bg-transparent border-none cursor-pointer">Need an account? Register here</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://yeabwnysjhhmjoimprbb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BjyrfHBBJ8V13lC00V5p2A_gSxohGxZ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegistering = false;

        function toggleMode() {
            isRegistering = !isRegistering;
            document.getElementById('formTitle').textContent = isRegistering ? 'Create Account' : 'Client Portal';
            document.getElementById('formSub').textContent = isRegistering ? 'Register your email to manage cleaning services.' : 'Sign in to access your estate records.';
            document.getElementById('submitBtn').textContent = isRegistering ? 'Register' : 'Sign In';
            document.getElementById('toggleBtn').textContent = isRegistering ? 'Already have an account? Sign in' : 'Need an account? Register here';
            document.getElementById('errorMsg').classList.add('hidden');
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.classList.add('hidden');

            if (isRegistering) {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.classList.remove('hidden');
                } else {
                    alert('Account created successfully! You can now sign in.');
                    toggleMode();
                }
            } else {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errorDiv.textContent = error.message;
                    errorDiv.classList.remove('hidden');
                } else {
                    window.location.href = 'portal.html';
                }
            }
        });
    </script>
</body>
</html>
