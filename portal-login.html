<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Service | Luxora Elite Cleaning SA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F17; color: #F8FAFC; }
    .gold-text { color: #C5A059; }
    .gold-bg-gradient { background: linear-gradient(135deg, #DFBF77 0%, #C5A059 100%); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

  <div class="max-w-lg mx-auto w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl my-12">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold uppercase tracking-wider text-white">
        Luxora <span class="gold-text">Elite</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">Book Your Private Cleaning Service</p>
    </div>

    <!-- Booking Form -->
    <form action="https://api.web3forms.com/submit" method="POST" id="luxoraBookingForm" class="space-y-4">
      
      <!-- Web3Forms Config Keys -->
      <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY_HERE">
      <input type="hidden" name="subject" value="New Luxora Elite Service Request">
      <input type="hidden" name="from_name" value="Luxora Elite Booking Portal">

      <!-- Full Name -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Full Name</label>
        <input 
          type="text" 
          name="Client Name" 
          placeholder="Jane Doe" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Email Address -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Email Address</label>
        <input 
          type="email" 
          name="Client Email" 
          placeholder="jane@example.com" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Phone Number</label>
        <input 
          type="tel" 
          name="Client Phone" 
          placeholder="(210) 555-0199" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
      </div>

      <!-- Service Requested -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Service Type</label>
        <select 
          name="Service Requested" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        >
          <option value="Executive Maintenance Cleaning">Executive Maintenance Cleaning</option>
          <option value="Deep Estate Restorative Cleaning">Deep Estate Restorative Cleaning</option>
          <option value="Move-In / Move-Out Elite">Move-In / Move-Out Elite</option>
        </select>
      </div>

      <!-- Special Instructions -->
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Special Notes / Address</label>
        <textarea 
          name="Booking Details" 
          rows="3" 
          placeholder="Property details, preferred date, or entry instructions..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#C5A059]"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3.5 gold-bg-gradient text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg hover:opacity-90 transition-opacity mt-4"
      >
        Submit Booking Request
      </button>

      <!-- Success / Error Status Messages -->
      <div id="formResult" class="text-center text-xs mt-3 hidden"></div>
    </form>
  </div>

  <!-- JavaScript Submission Handler -->
  <script>
    const form = document.getElementById('luxoraBookingForm');
    const result = document.getElementById('formResult');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      result.classList.remove('hidden');
      result.className = 'text-center text-xs mt-3 text-slate-400';
      result.innerHTML = "Sending request...";

      const formData = new FormData(form);

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        body: formData
      })
      .then(async (response) => {
        let json = await response.json();
        if (response.status == 200) {
          result.className = 'text-center text-xs mt-3 text-emerald-400 font-bold';
          result.innerHTML = "Booking request sent! Check your inbox soon.";
          form.reset();
        } else {
          result.className = 'text-center text-xs mt-3 text-rose-400 font-bold';
          result.innerHTML = json.message || "Something went wrong. Please try again.";
        }
      })
      .catch(error => {
        result.className = 'text-center text-xs mt-3 text-rose-400 font-bold';
        result.innerHTML = "Failed to send. Please check your internet connection.";
      });
    });
  </script>

</body>
</html>
