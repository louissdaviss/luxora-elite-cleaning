<script>
        const SUPABASE_URL = 'https://yeabwnysjhhmjoimprbb.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your public anon key
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initPortal() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.replace('portal-login.html');
                return;
            }

            const userEmail = session.user.email;
            document.getElementById('welcomeUser').textContent = `Welcome, ${userEmail}`;

            // Fetch specific record matching the logged-in user's email
            const { data, error } = await _supabase
                .from('Client Cleaning Records')
                .select('*')
                .eq('email', userEmail)
                .single();

            if (data) {
                document.getElementById('clientName').textContent = data.client_name || data.Name || userEmail;
                document.getElementById('clientAddress').textContent = data.address || data.Address || 'Registered Service Address';
                if(data.instructions) {
                    document.getElementById('clientInstructions').value = data.instructions;
                }
            } else {
                document.getElementById('clientName').textContent = userEmail;
                document.getElementById('clientAddress').textContent = 'Pending Profile Configuration';
            }
        }

        async function saveInstructions() {
            const newInstructions = document.getElementById('clientInstructions').value;
            const { data: { session } } = await _supabase.auth.getSession();
            if(!session) return;

            const { error } = await _supabase
                .from('Client Cleaning Records')
                .update({ instructions: newInstructions })
                .eq('email', session.user.email);

            if(error) {
                alert('Error saving instructions.');
            } else {
                alert('Special instructions updated successfully.');
            }
        }

        initPortal();
    </script>
