<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Account Portal | Luxora Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-full border border-[#C5A059] flex items-center justify-center bg-slate-800 text-[#C5A059] font-bold text-xs">LXE</div>
      <span class="font-bold text-slate-200 tracking-wider text-sm font-serif">LUXORA ELITE PORTAL</span>
    </div>
    
    <button id="logout-btn" class="px-4 py-2 rounded-lg bg-red-950/80 border border-red-800 text-red-200 hover:bg-red-900 transition-colors text-xs uppercase font-semibold">
      Log Out
    </button>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl space-y-6">
      
      <div class="border-b border-slate-800 pb-4 flex justify-between items-end">
        <div>
          <div class="inline-block px-2.5 py-1 rounded-md bg-slate-800/80 border border-slate-700 mb-2">
            <span class="text-[10px] font-mono tracking-widest text-slate-400 uppercase mr-1">Member No.</span>
            <span id="welcome-member-no" class="text-xs font-mono font-bold text-white">#LXE-00000</span>
          </div>

          <h1 class="text-2xl font-serif font-bold text-[#C5A059]">Welcome, <span id="welcome-name">Client</span></h1>
          <p class="text-slate-400 text-sm mt-1">Here is your personal estate care profile and account details.</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
          <span class="text-xs uppercase tracking-wider text-slate-500 block mb-1">Account Holder Name</span>
          <p id="user-display-name" class="text-slate-200 font-semibold text-base">Loading...</p>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
          <span class="text-xs uppercase tracking-wider text-slate-500 block mb-1">Email Address</span>
          <p id="user-display-email" class="text-slate-200 font-semibold text-base">Loading...</p>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 md:col-span-2">
          <span class="text-xs uppercase tracking-wider text-slate-500 block mb-1">Service Address</span>
          <p id="user-display-address" class="text-slate-200 font-semibold text-base">No service address provided yet</p>
        </div>

        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 md:col-span-2">
          <span class="text-xs uppercase tracking-wider text-slate-500 block mb-1">Unique Client ID</span>
          <p id="user-display-id" class="font-mono text-slate-400 text-xs">Loading...</p>
        </div>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://yeabwnysjhhmjoimprbb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BjyrfHBBJ8V13lC00V5p2A_gSxohGxZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function generateMemberNo(userId) {
      if (!userId) return '#LXE-00000';
      const hash = userId.replace(/[^a-zA-Z0-9]/g, '').slice(-5).toUpperCase();
      return `#LXE-${hash}`;
    }

    function renderUser(user) {
      const fullName = user.user_metadata?.full_name || 'Client Member';
      const address = user.user_metadata?.address || 'No service address provided yet';
      const memberNumber = generateMemberNo(user.id);

      document.getElementById('welcome-member-no').textContent = memberNumber;
      document.getElementById('welcome-name').textContent = fullName;
      document.getElementById('user-display-name').textContent = fullName;
      document.getElementById('user-display-email').textContent = user.email;
      document.getElementById('user-display-address').textContent = address;
      document.getElementById('user-display-id').textContent = user.id;
    }

    // Subscribe to state changes to handle async auth loading cleanly
    _supabase.auth.onAuthStateChange((event, session) => {
      if (!session && event !== 'INITIAL_SESSION') {
        window.location.replace('portal-login.html');
      } else if (session) {
        renderUser(session.user);
      } else {
        // Double check initial session state
        _supabase.auth.getSession().then(({ data: { session: currentSession } }) => {
          if (!currentSession) {
            window.location.replace('portal-login.html');
          } else {
            renderUser(currentSession.user);
          }
        });
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await _supabase.auth.signOut();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
